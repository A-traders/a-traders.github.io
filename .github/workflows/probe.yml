# Диагностическая проба планировщика (заведена в ночь 07→08.09.2026, после того как
# refresh.yml не был запущен по расписанию ни разу за ~25 точек, при рабочем ручном запуске).
#
# Задача пробы — отличить две причины:
#   * не зарегистрировался КОНКРЕТНЫЙ workflow (refresh.yml) → эта проба утром сработает;
#   * планировщик не поднимает расписания В ЭТОМ РЕПО вообще → не сработает и она.
# Ничего не делает и ничего не публикует: одна строка вывода, несколько секунд бесплатных
# минут публичного репо. УДАЛИТЬ, когда вопрос закрыт.
name: probe

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Отметиться
        run: |
          echo "проба планировщика — событие=${{ github.event_name }} cron=${{ github.event.schedule }} время UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
