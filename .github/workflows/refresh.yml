# Обновление данных сайта и публикация. Один прогон обновляет ВСЁ: CopyFX (разделы
# «Инвестировать» и «Главная») и сверку с блогом mql5 (разделы «Наборы SSN», «Советники»,
# счётчики на главной) — разделения по разделам в конвейере нет, вся работа в
# tools/pipeline.sh приватного репо A-traders/xaurus.pro.
#
# КТО ЗАПУСКАЕТ. Регулярность обеспечивает внешний планировщик — cron-job.org, задание
# «xaurus.pro — обновление сайта», каждый час в :07 шлёт workflow_dispatch с телом
# {"ref":"main","inputs":{"ssn":"true","force":"true"}}. Ручные запуски GitHub исполняет
# немедленно, в отличие от собственных расписаний: на этом аккаунте они срабатывают
# раз в 2,5–3 часа, а 07.09 не сработали ни разу за ~25 точек (при рабочем ручном запуске
# и без инцидентов на githubstatus). Собственных расписаний здесь нет вовсе.
#
# ПОЧЕМУ РАБОТА ИДЁТ В ПУБЛИЧНОМ РЕПО: минуты Actions здесь бесплатны и безлимитны, а в
# приватном списываются из квоты аккаунта (Free 2000 мин/мес, прогон округляется вверх до
# минуты). Исходник сайта клонируется сюда по SSH deploy key (секрет SRC_DEPLOY_KEY,
# право записи только на xaurus.pro).
name: refresh

on:
  # Расписаний GitHub здесь нет намеренно: на этом аккаунте они срабатывают раз в 2,5-3 часа,
  # а 07.09.2026 не сработали ни разу за ~25 точек. Запускает только внешний планировщик.
  workflow_dispatch:
    inputs:
      force:
        description: "Работать, даже если снимок свежий (иначе ручной запуск ведёт себя как сторожевой: свежие данные — выход)"
        type: boolean
        default: false
      ssn:
        description: "Сверить «Примеры SSN» с блогом mql5"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

env:
  FRESH_MIN: "45"     # снимок свежее этого числа минут — делать нечего, выходим

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Публичный репо (сюда публикуем)
        uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0     # полная история: pipeline.sh делает pull --rebase перед push

      - name: Ключ доступа к исходному репо
        env:
          SRC_DEPLOY_KEY: ${{ secrets.SRC_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SRC_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Клон исходного репо
        run: git clone --quiet git@github.com:A-traders/xaurus.pro.git src

      # Основной прогон работает всегда. Сторожевой — только если предыдущий не отработал,
      # то есть снимок CopyFX старше FRESH_MIN минут. Признак «отработал» — поле fetched_at
      # в data/copyfx/strategies.json: его пишет каждый успешный прогон конвейера.
      - name: Решение — работать или предыдущий уже отработал
        id: decide
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os

          def age_min(path, key):
              """Возраст отметки времени в минутах; None — если отметки нет."""
              try:
                  with open(path, encoding="utf-8") as f:
                      at = json.load(f)[key]
              except Exception:
                  return None
              t = dt.datetime.fromisoformat(at.replace("Z", "+00:00"))
              return (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 60

          fresh = float(os.environ["FRESH_MIN"])
          data_age = age_min("src/data/copyfx/strategies.json", "fetched_at")

          # Часовое задание шлёт force=true и работает всегда. Без этой галки запуск ведёт
          # себя осторожно: если снимок свежее FRESH_MIN, прогон выходит здесь же, ничего
          # не публикуя, — так пинок можно слать хоть каждые пять минут.
          if os.environ.get("INPUT_FORCE") == "true":
              run, why = True, "запуск извне (принудительно)"
          elif data_age is None:
              run, why = True, "запуск извне: снимка нет"
          elif data_age >= fresh:
              run, why = True, "запуск извне: снимку %.0f мин" % data_age
          else:
              run, why = False, "запуск извне: предыдущий отработал %.0f мин назад" % data_age

          # Что обновлять, решает сам вызов: часовое задание шлёт ssn=true, поэтому каждый
          # прогон освежает и CopyFX, и сверку с блогом — то есть все разделы сайта сразу.
          ssn = os.environ.get("INPUT_SSN") == "true"

          print("run=%s" % str(run).lower())
          print("ssn=%d" % int(bool(ssn)))
          print("why=%s" % why)
          PY
        env:
          INPUT_SSN: ${{ inputs.ssn }}
          INPUT_FORCE: ${{ inputs.force }}

      - name: Что решено
        run: echo "${{ steps.decide.outputs.why }}${{ steps.decide.outputs.run == 'true' && format(' — работаем (SSN={0})', steps.decide.outputs.ssn) || ' — пропуск' }}"

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Зависимости
        if: steps.decide.outputs.run == 'true'
        run: pip install --quiet cryptography

      - name: Обновить данные, собрать и опубликовать
        if: steps.decide.outputs.run == 'true'
        working-directory: src
        env:
          SITE_DIR: ${{ github.workspace }}/site
          RUN_SSN: ${{ steps.decide.outputs.ssn }}
          PUSH_DATA: "1"
          BASE_URL: https://a-traders.github.io
          EVENT: ${{ github.event_name }}
          SITE_LOGIN: ${{ secrets.SITE_LOGIN }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: bash tools/pipeline.sh
