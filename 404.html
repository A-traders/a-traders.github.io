<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — XAURUS.PRO</title>
<link rel="icon" href="/logo/x_emblem_64.png">
<meta name="theme-color" content="#08080c">
<style>
  /* Страница 404 GitHub Pages (копируется сборкой при --open). Палитра сайта, пути от корня. */
  :root{--bg:#08080c;--page:#1a1a20;--line:#26262e;--txt:#f2f2f5;--mut:#9a9aa6;--gold:#ffb13d;--ink:#2a1600}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
       background:var(--page);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif}
  .box{max-width:560px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;
       padding:36px 28px;box-shadow:0 8px 40px rgba(0,0,0,.6);text-align:center}
  .box img{height:44px;width:auto;margin-bottom:18px}
  h1{font-size:64px;line-height:1;margin:0 0 10px;color:var(--gold);letter-spacing:2px}
  p{color:var(--mut);line-height:1.6;margin:6px 0}
  .langs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .langs a{padding:9px 16px;border-radius:9px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-weight:600}
  .langs a:hover{background:var(--gold);color:var(--ink)}
  .small{font-size:13px;margin-top:18px}
  .small a{color:var(--mut)}
  .small a:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="box">
  <img src="/logo/v4a_top.svg" alt="XAURUS.PRO">
  <h1>404</h1>
  <p>The page you requested does not exist or has moved.</p>
  <p>Такой страницы нет или она переехала. · Мұндай бет жоқ немесе көшірілген.</p>
  <div class="langs"><a href="/">English</a><a href="/ru/">Русский</a><a href="/kz/">Қазақша</a></div>
  <p class="small"><a href="/#robots">Robots</a> · <a href="/#guide">Guide</a> · <a href="/#ssn">SSN sets</a> · <a href="/#invest">Invest</a> · <a href="/#contacts">Contacts</a></p>
</div>
</body>
</html>
