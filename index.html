<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>XAURUS.PRO — вход</title>
<link rel="icon" href="logo/x_emblem_64.png">
<style>
  :root{--bg:#0b0b0f;--panel:#15151c;--line:#26262f;--txt:#ececf1;--mut:#8b8b98;--gold:#ffb13d;--gold2:#ff7a00}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  .uc{background:repeating-linear-gradient(45deg,#e8b84b,#e8b84b 14px,#131a2e 14px,#131a2e 28px);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:7px;letter-spacing:.5px;text-shadow:0 1px 3px #000}
  .wrap{min-height:calc(100vh - 34px);display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .logo{display:block;height:48px;width:auto;margin:0 auto 22px}
  h1{font-size:17px;font-weight:600;margin:0 0 6px;text-align:center}
  p.sub{color:var(--mut);font-size:13px;margin:0 0 20px;text-align:center}
  label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px}
  input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0e0e13;color:var(--txt);font-size:15px;outline:none}
  input:focus{border-color:var(--gold)}
  button{width:100%;margin-top:18px;padding:11px;border:none;border-radius:9px;cursor:pointer;font-weight:700;font-size:15px;color:#1a1000;
    background:linear-gradient(180deg,var(--gold),var(--gold2))}
  button[disabled]{opacity:.55;cursor:default}
  .err{display:none;color:#ff8f6b;font-size:13px;margin-top:12px;text-align:center}
  .err.on{display:block}
  .foot{color:#5d5d68;font-size:12px;text-align:center;margin-top:18px}
  #busy{display:none;text-align:center;color:var(--mut);font-size:14px;padding:40px 0}
  #busy.on{display:block}
  #busy.on ~ form{display:none}
</style>
</head>
<body>
<div class="uc">🚧 UNDER CONSTRUCTION — сайт в разработке 🚧</div>
<div class="wrap">
  <div class="box">
    <img class="logo" src="logo/v4a_top.svg" alt="XAURUS.PRO">
    <div id="busy">Загрузка…</div>
    <form id="f" autocomplete="on">
      <h1>Закрытый предпросмотр</h1>
      <p class="sub">Сайт готовится к запуску. Введите логин и пароль, выданные разработчиком.</p>
      <label for="u">Логин</label>
      <input id="u" name="username" type="text" autocomplete="username" required autofocus>
      <label for="p">Пароль</label>
      <input id="p" name="password" type="password" autocomplete="current-password" required>
      <button id="b" type="submit">Войти</button>
      <div class="err" id="e">Неверный логин или пароль.</div>
      <div class="foot">xaurus.pro · AI Pro100</div>
    </form>
  </div>
</div>
<script>
(function(){
  /* Содержимое сайта лежит в site.enc: "XPRO1" + соль(16) + IV(12) + AES-256-GCM(HTML).
     Ключ = PBKDF2-SHA256(логин + "\n" + пароль, соль, 300 000 итераций). Успешный ключ
     запоминается в localStorage — повторные визиты открывают сайт без формы. */
  var KEY = "xaurus_gate_key", ENC = "site.enc";
  var f = document.getElementById("f"), u = document.getElementById("u"), p = document.getElementById("p"),
      b = document.getElementById("b"), e = document.getElementById("e"), busy = document.getElementById("busy");
  var te = new TextEncoder(), td = new TextDecoder();
  var blob = null;

  function b64(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function unb64(s){ var bin = atob(s), a = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a.buffer; }

  function load(){
    if (blob) return Promise.resolve(blob);
    return fetch(ENC, {cache:"no-store"}).then(function(r){
      if (!r.ok) throw new Error("no site.enc");
      return r.arrayBuffer();
    }).then(function(ab){
      var a = new Uint8Array(ab);
      if (td.decode(a.slice(0,5)) !== "XPRO1") throw new Error("bad magic");
      blob = {salt:a.slice(5,21), iv:a.slice(21,33), data:a.slice(33)};
      return blob;
    });
  }
  function derive(login, pass, salt){
    return crypto.subtle.importKey("raw", te.encode(login + "\n" + pass), "PBKDF2", false, ["deriveKey"])
      .then(function(k){
        return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:300000, hash:"SHA-256"}, k,
          {name:"AES-GCM", length:256}, true, ["decrypt"]);
      });
  }
  function open(key){
    return load().then(function(bl){
      return crypto.subtle.decrypt({name:"AES-GCM", iv:bl.iv}, key, bl.data);
    }).then(function(plain){
      var html = td.decode(plain);
      document.open(); document.write(html); document.close();
    });
  }
  function fail(){
    busy.classList.remove("on"); b.disabled = false; e.classList.add("on"); p.value = ""; p.focus();
  }

  /* сохранённый ключ — открываем без формы */
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch(err){}
  if (saved){
    busy.classList.add("on");
    crypto.subtle.importKey("raw", unb64(saved), {name:"AES-GCM"}, true, ["decrypt"])
      .then(open)
      .catch(function(){ try { localStorage.removeItem(KEY); } catch(err){} busy.classList.remove("on"); });
  }

  f.addEventListener("submit", function(ev){
    ev.preventDefault();
    e.classList.remove("on"); b.disabled = true;
    var login = u.value.trim(), pass = p.value;
    var key;
    load().then(function(bl){ return derive(login, pass, bl.salt); })
      .then(function(k){ key = k; return crypto.subtle.exportKey("raw", k); })
      .then(function(raw){ try { localStorage.setItem(KEY, b64(raw)); } catch(err){} return open(key); })
      .catch(function(){ try { localStorage.removeItem(KEY); } catch(err){} fail(); });
  });
})();
</script>
</body>
</html>
